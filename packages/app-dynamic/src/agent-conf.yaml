schemaVersion: 1
interfaces:
  env:
    - env-node
  ai:
    - id: ai-codex
      config:
        model: gpt-5.6-sol
  discovery:
    - discovery-memory
  database:
    - database-sqlite
  memory:
    - memory-database
  orchestrator:
    - orchestrator-default
  agent:
    - id: agent-loop
      config:
        maxSteps: 100
  input:
    - cronjob
    - telegram
    - id: openrouter-api
      config:
        hostname: 127.0.0.1
        port: 3000
        model: agent-os
        corsOrigins: "*"
        log: true
    - io-cli
  output:
    - io-cli
    - telegram
    - id: openrouter-api
      config:
        hostname: 127.0.0.1
        port: 3000
        model: agent-os
        corsOrigins: "*"
        log: true
  action:
    - action-cli
    - chrome-control
    - pc-control
    - perplexity-search
    - cronjob
