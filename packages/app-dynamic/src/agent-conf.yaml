schemaVersion: 1

interfaces:
  env:
    - env-node
  ai:
    - ai-codex
  discovery:
    - discovery-memory
  orchestrator:
    - orchestrator-default
  agent:
    - agent-loop
  input:
    - io-cli
    - cronjob
    - id: openrouter-api
      config:
        hostname: 127.0.0.1
        port: 3000
        model: agent-os
        corsOrigins: "*"
        log: true
        # apiKey: set via OPENROUTER_API_KEY or here
  output:
    - io-cli
    # Must be the same package id as input so boot reuses one instance
    # (OpenRouterApiInput.write needs the active HTTP request context).
    - id: openrouter-api
      config:
        hostname: 127.0.0.1
        port: 3000
        model: agent-os
        corsOrigins: "*"
        log: true
    - telegram
  action:
    - action-cli
    - perplexity-search
    - cronjob
