schemaVersion: 1
id: pc-control
name: macOS PC Control
version: 0.5.0
description: Control macOS applications through native automation
interfaces:
  - id: pc-control.action
    kind: action
    entry: .
    export: .
    className: MacOSControlCapability
    name: MacOSControlCapability
    description: Controls the local Mac through native macOS automation APIs
    surfaces:
      - local
      - macos
    permissions:
      - macos.accessibility
      - macos.automation
      - macos.screen-recording
      - filesystem.write
    config:
      - key: requestPermissionsOnInit
        env: PC_CONTROL_REQUEST_PERMISSIONS
        type: boolean
        required: false
        default: true
        description: Request macOS privacy permissions when Agent OS starts
      - key: maxAccessibilityDepth
        env: PC_CONTROL_ACCESSIBILITY_DEPTH
        type: number
        required: false
        default: 5
        description: Maximum depth returned by get_accessibility_tree
      - key: maxAccessibilityElements
        env: PC_CONTROL_ACCESSIBILITY_ELEMENTS
        type: number
        required: false
        default: 400
        description: Maximum UI elements returned by get_accessibility_tree
    capability:
      id: macos.pc-control
      version: 0.5.0
      name: control_macos
      description: Prefer element-index actions for exposed native controls and screenshot plus coordinate click/drag for visual canvases such as Figma.
      inputSchema:
        type: object
        properties:
          operation:
            type: string
            enum:
              - permissions
              - open_app
              - focus_app
              - quit_app
              - list_apps
              - get_accessibility_tree
              - get_app_state
              - click_element
              - set_element_value
              - perform_element_action
              - move_mouse
              - click
              - drag
              - scroll
              - type_text
              - press_key
              - screenshot
          app:
            type: string
          text:
            type: string
          key:
            type: string
          modifiers:
            type: array
            items:
              type: string
              enum: [command, control, option, shift]
          x:
            type: number
          y:
            type: number
          fromX:
            type: number
            description: Drag start x coordinate
          fromY:
            type: number
            description: Drag start y coordinate
          toX:
            type: number
            description: Drag end x coordinate
          toY:
            type: number
            description: Drag end y coordinate
          button:
            type: string
            enum: [left, right, center]
          clicks:
            type: integer
            minimum: 1
            maximum: 3
          durationMs:
            type: integer
            minimum: 0
            maximum: 10000
            description: Duration of a drag gesture in milliseconds; defaults to 500
          steps:
            type: integer
            minimum: 1
            maximum: 240
            description: Number of interpolated pointer movements during a drag; defaults to 30
          deltaX:
            type: integer
          deltaY:
            type: integer
          path:
            type: string
          depth:
            type: integer
            minimum: 0
            maximum: 20
          maxElements:
            type: integer
            minimum: 1
            maximum: 5000
          value:
            type: string
            description: Value for set_element_value
          waitMs:
            type: integer
            minimum: 0
            maximum: 10000
          elementIndex:
            type: integer
            minimum: 0
            description: Fresh elementIndex from get_app_state or the state returned by the previous element action
          action:
            type: string
            description: Accessibility action exposed by the element, such as AXPress or AXShowMenu
          includeScreenshot:
            type: boolean
            description: Include a screenshot in app-state observations; defaults to true
        required:
          - operation
        additionalProperties: false
      permissions:
        - macos.accessibility
        - macos.automation
        - macos.screen-recording
        - filesystem.write
      tags:
        - macos
        - desktop
        - accessibility
        - mouse
        - keyboard
        - virtual-input
      execution:
        timeoutMs: 30000
        idempotent: false
    startup:
      when: always
