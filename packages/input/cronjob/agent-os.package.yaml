schemaVersion: 1
id: cronjob
name: Cronjob
version: 0.1.0
description: Persistent scheduled prompts plus a capability to manage cron jobs
interfaces:
  - id: cronjob.input
    kind: input
    entry: .
    export: .
    className: CronjobInput
    description: Fires scheduled prompts into the agent loop
    channel: cronjob
    surfaces:
      - local
      - filesystem
    permissions:
      - cronjobs.read
      - filesystem
    config:
      - key: databasePath
        env: CRONJOB_DB_PATH
        type: string
        required: false
        description: SQLite path for cron job persistence (defaults to .agent-os/cronjobs.sqlite)
    startup:
      when: always
    name: CronjobInput
  - id: cronjob.action
    kind: action
    entry: .
    export: .
    className: ManageCronjobsCapability
    description: Adds, lists, suspends, resumes, or removes scheduled prompts
    surfaces:
      - local
      - filesystem
    permissions:
      - cronjobs.read
      - cronjobs.write
    capability:
      id: cronjobs.manage
      version: 1.0.0
      name: manage_cronjobs
      description: Adds, lists, suspends, resumes, or removes persistent scheduled prompts.
      inputSchema:
        type: object
        properties:
          action:
            type: string
            enum:
              - add
              - list
              - suspend
              - resume
              - remove
        required:
          - action
      permissions:
        - cronjobs.read
        - cronjobs.write
      tags:
        - cron
        - schedule
    startup:
      when: always
    name: ManageCronjobsCapability
