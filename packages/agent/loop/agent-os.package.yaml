schemaVersion: 1
id: agent-loop
name: Default Agent Loop
version: 0.1.0
description: Default agent loop that runs the model with selected capabilities
interfaces:
  - id: agent-loop.agent
    kind: agent
    entry: .
    export: .
    className: DefaultAgentLoop
    description: Executes the model/tool loop for a message
    surfaces:
      - local
    config:
      - key: maxSteps
        type: number
        required: false
        default: 100
        description: Maximum model/tool steps per run before failing
      - key: maxCapabilities
        type: number
        required: false
        default: 50
        description: Maximum capabilities loaded into a single run
    startup:
      when: always
    name: DefaultAgentLoop
